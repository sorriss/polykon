<header class="site-header">
  <a class="brand" routerLink="/">
    <img
      ngSrc="assets/images/logo.png"
      alt="logo"
      class="brand-logo"
      width="127"
      height="18"
      priority
      decoding="async"
    />
  </a>

  <nav class="main-nav">
    @for (item of navigation; track item.path) {
      <a [routerLink]="item.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: item.path === '' }">
        {{ text(item.key) }}
      </a>
    }
  </nav>

  <div class="header-actions">
    <div class="lang-switcher">
      <button type="button" [class.active]="language() === 'en'" (click)="setLanguage('en')">EN</button>
      <span class="lang-sep">|</span>
      <button type="button" [class.active]="language() === 'ua'" (click)="setLanguage('ua')">UA</button>
    </div>

    <button class="booking-btn" type="button" (click)="openBooking()">
      {{ text('booking.cta') }}
    </button>
  </div>
</header>

@if (isBookingOpen()) {
  <app-booking-modal (closed)="closeBooking()" />
}
