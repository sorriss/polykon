<section class="about-section">
  <div class="about-text">
    <div class="about-text-inner">
      <h1 class="about-title">{{ text('about.title') }}</h1>
      <p class="about-para">{{ text('about.para1') }}</p>
      <p class="about-para">{{ text('about.para2') }}</p>
    </div>
  </div>

  <div class="about-photo">
    <img
      ngSrc="/assets/images/about.jpg"
      alt="{{ text('about.title') }}"
      width="1200"
      height="1600"
      loading="lazy"
      decoding="async"
    />
  </div>
</section>
