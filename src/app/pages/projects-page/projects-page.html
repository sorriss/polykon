<section class="projects-section">
  <h1 class="projects-title">{{ text('projects.title') }}</h1>

  <div class="projects-grid">
    @for (project of projects; track project.id; let isFirst = $first) {
      <a [routerLink]="['/projects', project.id]" class="project-card">
        @if (isFirst) {
          <img
            [ngSrc]="coverImage(project.folder)"
            [alt]="project.name"
            width="1200"
            height="900"
            priority
            decoding="async"
          />
        } @else {
          <img
            [ngSrc]="coverImage(project.folder)"
            [alt]="project.name"
            width="1200"
            height="900"
            loading="lazy"
            decoding="async"
          />
        }
      </a>
    }
  </div>
</section>
